<!DOCTYPE html>
<html>
<head>
  <title>Spinning Donut</title>
  <style>
    body {
      background: black;
      color: white;
      font-family: monospace;
      white-space: pre;
      overflow: hidden;
    }
  </style>
</head>
<body>
<pre id="donut"></pre>

<script>
let A = 0, B = 0;
const pre = document.getElementById("donut");

setInterval(() => {
  let b = [];
  let z = [];

  for (let i = 0; i < 1760; i++) {
    b[i] = " ";
    z[i] = 0;
  }

  for (let j = 0; j < 6.28; j += 0.07) {
    for (let i = 0; i < 6.28; i += 0.02) {
      let c = Math.sin(i),
          d = Math.cos(j),
          e = Math.sin(A),
          f = Math.sin(j),
          g = Math.cos(A),
          h = d + 2,
          D = 1 / (c * h * e + f * g + 5),
          l = Math.cos(i),
          m = Math.cos(B),
          n = Math.sin(B),
          t = c * h * g - f * e;

      let x = 40 + 30 * D * (l * h * m - t * n);
      let y = 12 + 15 * D * (l * h * n + t * m);
      let o = Math.floor(x + 80 * y);
      let N = Math.floor(8 * ((f * e - c * d * g) * m - c * d * e - f * g - l * d * n));

      if (y < 22 && y >= 0 && x >= 0 && x < 80 && D > z[o]) {
        z[o] = D;
        b[o] = ".,-~:;=!*#$@"[N > 0 ? N : 0];
      }
    }
  }

  pre.textContent = b.join("");
  A += 0.04;
  B += 0.02;

}, 30);
</script>
</body>
</html>
